spring.config.import=optional:file:./.env[.properties]

server.port=8080

ganache.rpc.url=${GANACHE_RPC_URL:http://127.0.0.1:7545}
ganache.private.key=${GANACHE_PRIVATE_KEY:}
contract.address=${CONTRACT_ADDRESS:}
storage.node1=${STORAGE_NODE1:storage_node1}
storage.node2=${STORAGE_NODE2:storage_node2}
storage.node3=${STORAGE_NODE3:storage_node3}
storage.edge=${STORAGE_EDGE:edge_node}

# Encryption: ChaCha20-Poly1305 (per-file key generated at runtime — no static key needed)

# Multipart file upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ─── MySQL Database ──────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:blockchain_storage}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── Pre-configured Admin Account ───────────────────────────────────────
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}